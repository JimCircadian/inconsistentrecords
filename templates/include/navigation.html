<nav class="navbar navbar-expand-lg fixed-top navbar-light bg-light">
  <a class="text-muted navbar-brand{% if this._path == '/' %} class="active"{% endif %}" href="{{ '/'|url }}">Inconsistent Records</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav">
      {% for href, title in [
        ['/blog', 'Blog'],
        ['/label', 'Netlabel'],
    	['/now', 'Now'],
        ['/about', 'About']
      ] %}
        <li class="nav-item {% if this.is_child_of(href) %}active{% endif %}">
          <a class="nav-link" href="{{ href|url }}">{{ title }}</a></li>
      {% endfor %}
    </ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item">
        <form id="signup-form" class="row g-3" action="{{ '/signup'|url }}" method="POST">
          <!--<p id="signup-message" style="display:block;">&nbsp;</p>-->
          <div class="col-auto">
            <label class="form-label form-label nav-link" for="email">Email: </label>
          </div>
          <div class="col-auto">
            <input id="signup-email" class="form-control form-control-sm" type="text" placeholder="Enter Email" name="email" />
          </div>
          <div class="col-auto">
            <input id="signup-subscribe" class="btn btn-secondary mb-3" type="submit" value="Subscribe" />
          </div>
        </form>
      </li>
    </ul>
  </div>
</nav>
